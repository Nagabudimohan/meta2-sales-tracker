<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>2025 Sales Tracker &bull; Mohan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #f8fafc; font-family: Inter, sans-serif; color: #222; }
    header {
      background: #fff;
      padding: 2rem 0 1.5rem 0;
      box-shadow: 0 2px 8px 0 rgba(0,0,0,0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      margin-bottom: 1rem;
    }
    .logo-wrap {
      width: 48px; height: 48px;
      background: #f1f5f9;
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 8px 0 #e4e4e7;
      margin-bottom: 0.8rem;
    }
    .logo-img {
      width: 32px;
      height: 32px;
      /* Use filter: grayscale for subtlety + color drop-shadow for visibility */
      filter: drop-shadow(0 0 2px #6366f1);
      object-fit: contain;
      opacity: 0.95;
    }
    h1 {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #4338ca;
      margin: 0;
    }
    .subtext {
      font-size: 1rem; color: #64748b; letter-spacing: 0.02em; margin-top: 0.2em;
    }
    .card {
      background: #fff;
      border-radius: 1rem;
      box-shadow: 0 2px 8px 0 #f1f5f9;
      padding: 2rem;
      margin-bottom: 1.5rem;
      max-width: 1000px;
    }
    input {
      border: none;
      background: #f1f5f9;
      border-radius: 0.6rem;
      padding: 0.8em 0.7em;
      font-size: 1.05rem;
      outline: none;
      width: 100%;
      box-shadow: 0 1px 4px 0 #e0e7ff;
      margin-bottom: 0.15rem;
      transition: box-shadow 0.25s, background 0.2s;
    }
    input:focus {
      background: #e0e7ff;
      box-shadow: 0 3px 16px 0 #dbeafe;
    }
    label {
      display: block;
      font-size: 0.97rem;
      color: #6b7280;
      margin-bottom: 0.12rem;
      font-weight: 500;
    }
    #filter-stockist { max-width: 250px; margin-bottom: 1.1rem; }
    /* Table styles */
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 0.6rem;
    }
    thead tr {
      position: sticky; top: 0;
      background: #f4f4ff;
      z-index: 1;
    }
    th, td {
      border: none;
      text-align: center;
      padding: 1em 0.6em;
      vertical-align: middle;
    }
    th {
      font-size: 0.92rem;
      color: #6366f1;
      background: #f6f7fd;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
      border-radius: 0.5em 0.5em 0 0;
    }
    td {
      background: #f1f5f9;
      border-radius: 0.6em;
      font-size: 1.01rem;
      color: #23282d;
      box-shadow: 0 2px 8px 0 #f1f5f9;
      font-weight: 500;
    }
    tbody tr:hover td {
      background: #e0e7ff;
      color: #3730a3;
      transition: background 0.2s, color 0.2s;
    }
    .btn-add {
      background-color: #4338ca;
      color: #fff;
      padding: 0.7em 1.3em;
      border-radius: 0.65em;
      font-size: 1.05rem;
      font-weight: 500;
      display: flex; align-items: center; gap: 0.4em;
      box-shadow: 0 2px 8px 0 #e0e7ff;
      transition: background 0.18s, box-shadow 0.18s;
    }
    .btn-add:hover { background: #6366f1; box-shadow: 0 3px 12px 0 #c7d2fe; }
    .btn-del {
      color: #ef4444;
      background: transparent;
      border: none;
      font-size: 1.1em;
      border-radius: 0.4em;
      cursor: pointer;
      padding: 0.3em 0.7em;
      transition: color 0.2s, background 0.2s;
    }
    .btn-del:hover { color: #b91c1c; background: #ffe4e6; }
    .totals-row td { background: #f4f3ff !important; color: #a21caf; font-weight: 700; }
    .highlight {
      animation: highlight-bg 1s;
    }
    @keyframes highlight-bg {
      from { background-color: #c7d2fe; }
      to { background-color: transparent; }
    }
    @media (max-width:700px) {
      html { font-size: 95%; }
      .card { padding: 1em; }
      th, td { padding: 0.55em 0.25em;  }
    }
    @media (max-width:480px) {
      header { padding: 1.4em 0 0.7em 0; }
      .logo-wrap { width: 38px; height: 38px; }
      .card { padding: 0.6em; }
      .btn-add { padding: 0.6em 0.8em;}
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center">
  <header>
    <div class="logo-wrap">
      <!-- Replace with your SVG, PNG or Emoji for direct visibility (SVG for best minimalist look) -->
      <img src="https://img.icons8.com/ios-filled/50/4338ca/commercial.png" alt="Logo" class="logo-img">
    </div>
    <h1>Sales Tracker</h1>
    <div class="subtext">2025 &bull; Made by Mohan</div>
  </header>
  <main class="flex-grow flex flex-col w-full items-center">
    <section class="card w-full max-w-xl mx-auto">
      <!-- Price Inputs -->
      <div class="grid grid-cols-1 sm:grid-cols-4 gap-6 mb-5">
        <div>
          <label>Resource Diabetic ₹</label>
          <input id="price-resd" type="number" value="0">
        </div>
        <div>
          <label>Optifast ₹</label>
          <input id="price-opti" type="number" value="118752">
        </div>
        <div>
          <label>Resource ₹</label>
          <input id="price-res" type="number" value="5064.66">
        </div>
        <div>
          <label>Fiberchoice ₹</label>
          <input id="price-fib" type="number" value="0">
        </div>
      </div>
      <!-- Stockist Search Box -->
      <input id="filter-stockist" type="search" placeholder="Search Stockists...">
      <!-- Data Table -->
      <div class="w-full overflow-x-auto">
        <table>
          <thead>
            <tr>
              <th>Stockist</th>
              <th>Res-Di Units</th>
              <th>Res-Di Total</th>
              <th>Opti Units</th>
              <th>Opti Total</th>
              <th>Res Units</th>
              <th>Res Total</th>
              <th>Fib Units</th>
              <th>Fib Total</th>
              <th>Grand Total</th>
              <th class="text-center">Actions</th>
            </tr>
          </thead>
          <tbody id="body-sales"></tbody>
          <tfoot>
            <tr class="totals-row">
              <td>Totals</td>
              <td id="sum-resd-u">0</td>
              <td id="sum-resd-v">0.00</td>
              <td id="sum-opti-u">0</td>
              <td id="sum-opti-v">0.00</td>
              <td id="sum-res-u">0</td>
              <td id="sum-res-v">0.00</td>
              <td id="sum-fib-u">0</td>
              <td id="sum-fib-v">0.00</td>
              <td id="sum-grand">0.00</td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>
      <!-- Add & Clear Buttons -->
      <div class="flex gap-4 mt-6 justify-center">
        <button id="btn-add" class="btn-add">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
               viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 5v14m7-7H5"/>
          </svg>
          <span>Add Stockist</span>
        </button>
        <button id="btn-clear" class="btn-del">Clear All</button>
      </div>
    </section>
  </main>
  <footer class="text-center text-xs text-gray-500 py-4">
    &copy; 2025 Sales Tracker &bull; Made by Mohan
  </footer>
  <script>
    function el(id){return document.getElementById(id);}
    function animateSum(cell, value) {
      cell.textContent = value;
      cell.classList.remove('highlight');
      void cell.offsetWidth;
      cell.classList.add('highlight');
    }
    const priceResD = el('price-resd'), priceOpti = el('price-opti'),
          priceRes = el('price-res'), priceFib = el('price-fib'),
          body = el('body-sales'), btnAdd = el('btn-add'),
          sums = { rdU: el('sum-resd-u'), rdV: el('sum-resd-v'),
                   oU: el('sum-opti-u'), oV: el('sum-opti-v'),
                   rU: el('sum-res-u'), rV: el('sum-res-v'),
                   fU: el('sum-fib-u'), fV: el('sum-fib-v'),
                   grand: el('sum-grand') };
    const STORAGE='tracker-units-first-minimalist';
    let state=JSON.parse(localStorage.getItem(STORAGE)||'{"rows":[]}');
    state.rows.forEach(addRow); calc();
    btnAdd.onclick=_=>{addRow();persist();calc()};
    [priceResD,priceOpti,priceRes,priceFib].forEach(i=>i.oninput=_=>{persist();calc()});
    function addRow(d={name:'',rd:0,o:0,r:0,f:0}) {
      const tr=document.createElement('tr'); tr.innerHTML=`
      <td><input class="w-full" value="${d.name}" placeholder="Name"></td>
      <td><input type=number min=0 class="qty-rd" value="${d.rd}"></td>
      <td class="cell-rd-v">0.00</td>
      <td><input type=number min=0 class="qty-o" value="${d.o}"></td>
      <td class="cell-o-v">0.00</td>
      <td><input type=number min=0 class="qty-r" value="${d.r}"></td>
      <td class="cell-r-v">0.00</td>
      <td><input type=number min=0 class="qty-f" value="${d.f}"></td>
      <td class="cell-f-v">0.00</td>
      <td class="cell-grand">0.00</td>
      <td><button class="btn-del">🗑</button></td>`;
      tr.querySelectorAll('input').forEach(i=>i.oninput=_=>{persist();calc()});
      tr.querySelector('.btn-del').onclick=_=>{
        if(confirm('Are you sure you want to delete this stockist?')) {
          tr.remove();persist();calc();
        }
      };
      body.appendChild(tr);
    }
    function calc() {
      let rdU=0,oU=0,rU=0,fU=0,rdV=0,oV=0,rV=0,fV=0, g=0,
          pRD=+priceResD.value,pO=+priceOpti.value,pR=+priceRes.value,pF=+priceFib.value;
      [...body.rows].forEach(tr=>{
        const qRD=+tr.querySelector('.qty-rd').value||0,
              qO=+tr.querySelector('.qty-o').value||0,
              qR=+tr.querySelector('.qty-r').value||0,
              qF=+tr.querySelector('.qty-f').value||0,
              vRD=qRD*pRD, vO=qO*pO, vR=qR*pR, vF=qF*pF,
              rowTotal=vRD+vO+vR+vF;
        tr.querySelector('.cell-rd-v').textContent=vRD.toFixed(2);
        tr.querySelector('.cell-o-v').textContent=vO.toFixed(2);
        tr.querySelector('.cell-r-v').textContent=vR.toFixed(2);
        tr.querySelector('.cell-f-v').textContent=vF.toFixed(2);
        tr.querySelector('.cell-grand').textContent=rowTotal.toFixed(2);
        rdU+=qRD; oU+=qO; rU+=qR; fU+=qF;
        rdV+=vRD; oV+=vO; rV+=vR; fV+=vF;
        g+=rowTotal;
      });
      animateSum(sums.rdU, rdU);
      animateSum(sums.rdV, rdV.toFixed(2));
      animateSum(sums.oU, oU);
      animateSum(sums.oV, oV.toFixed(2));
      animateSum(sums.rU, rU);
      animateSum(sums.rV, rV.toFixed(2));
      animateSum(sums.fU, fU);
      animateSum(sums.fV, fV.toFixed(2));
      animateSum(sums.grand, g.toFixed(2));
    }
    function persist(){
      const rows=[...body.rows].map(tr=>({
        name:tr.cells[0].firstChild.value,
        rd:tr.querySelector('.qty-rd').value,
        o:tr.querySelector('.qty-o').value,
        r:tr.querySelector('.qty-r').value,
        f:tr.querySelector('.qty-f').value
      }));
      localStorage.setItem(STORAGE,JSON.stringify({rows}));
    }
    // Filter/search for stockists
    el('filter-stockist').oninput = e => {
      const filter = e.target.value.toLowerCase();
      [...body.rows].forEach(tr => {
        const name = tr.cells[0].firstChild.value.toLowerCase();
        tr.style.display = name.includes(filter) ? '' : 'none';
      });
    };
    el('btn-clear').onclick = () => {
      if (confirm('Clear all stockist data?')) {
        body.innerHTML = '';
        persist();
        calc();
      }
    };
  </script>
</body>
</html>
