<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>2025 Sales Tracker • Mohan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --primary: #0a1931;
      --accent: #185adb;
      --surface: #f7fafd;
    }
    body {
      margin: 0;
      background: var(--surface);
      font-family: Inter, Arial, sans-serif;
      color: var(--primary);
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh;
    }
    header {
      position: relative;
      width: 100%; max-width: 1000px;
      background: #fff;
      box-shadow: 0 4px 16px rgba(0,0,0,0.05);
      border-radius: 0 0 1rem 1rem;
      padding: 3rem 1rem 1rem; /* extra top padding for logo */
      text-align: center;
      margin-top: 2rem;
    }
    .track-logo {
      position: absolute;
      top: 0; left: 50%;
      transform: translate(-50%,-50%);
      width: 64px; height: 64px;
      background: #fff; border-radius: 50%;
      padding: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      margin: 0.5rem 0 0.25rem;
      font-size: 2.1rem; font-weight: 700;
      color: var(--accent);
    }
    .subtext {
      margin: 0; color: #677483; font-size: 1rem;
    }
    main.card {
      width: 100%; max-width: 1000px;
      background: #fff; border-radius: 1rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      padding: 2rem 1.5rem; margin: -1.5rem 0 2rem;
    }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px,1fr));
      gap: 1.5rem;
    }
    label {
      display: flex; align-items: center; gap: 0.5rem;
      font-weight: 600; color: #374151; font-size: 0.95rem;
      margin-bottom: 0.25rem;
    }
    label img {
      width: 28px; height: 28px; object-fit: contain;
    }
    input[type="number"], input[type="search"] {
      width: 100%; padding: 0.6rem 0.75rem;
      border: 1px solid #dbe0ea; border-radius: 0.6rem;
      background: #f1f4fa; font-size: 1rem;
      transition: box-shadow .2s, border-color .2s;
    }
    input:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(24,90,219,0.25);
    }
    .search-box {
      margin: 1.5rem 0; text-align: center;
    }
    .search-box input {
      max-width: 300px;
    }
    table {
      width: 100%; border-collapse: separate;
      border-spacing: 0 0.6rem; margin-top: 1rem;
    }
    th {
      background: #eef3ff; color: var(--accent);
      text-transform: uppercase; font-weight: 700;
      font-size: 0.8rem; padding: 0.75rem 0.5rem;
      text-align: center;
    }
    td {
      background: #fff; border-radius: 0.6rem;
      padding: 0.75rem 0.5rem; font-size: 0.95rem;
      font-weight: 500; color: #1f2d3d;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      text-align: center;
    }
    tbody tr:hover td {
      background: #e0ecff;
    }
    .totals-row td {
      background: #eaf0ff; font-weight: 700; color: var(--accent);
    }
    .actions {
      display: flex; justify-content: center; gap: 1rem; margin-top: 2rem;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.7rem 1.2rem; font-weight: 600; border: none;
      border-radius: 0.6rem; cursor: pointer;
      transition: background .2s, box-shadow .2s;
    }
    .btn-add {
      background: var(--accent); color: #fff;
      box-shadow: 0 3px 12px rgba(24,90,219,0.25);
    }
    .btn-add:hover {
      background: #102154;
    }
    .btn-download {
      background: #10b981; color: #fff;
      box-shadow: 0 3px 12px rgba(16,185,129,0.25);
    }
    .btn-download:hover {
      background: #0f766e;
    }
    .btn-del {
      color: #e74c3c; background: transparent;
      font-size: 1.1rem; padding: 0.3rem 0.6rem;
    }
    .btn-del:hover {
      color: #c0392b;
    }
    footer {
      text-align: center; color: #6b7280;
      margin-bottom: 1rem; font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <img class="track-logo" src="https://img.icons8.com/fluency/96/sales-performance.png" alt="Tracker Logo"/>
    <h1>Sales Tracker</h1>
    <p class="subtext">2025 • Made by Mohan</p>
  </header>

  <main class="card">

    <div class="products-grid">
      <div>
        <label>
          <img src="https://img.icons8.com/fluency/48/glucose-meter.png" alt="Resource Diabetic"/>
          Resource Diabetic ₹
        </label>
        <input id="price-resd" type="number" value="0"/>
      </div>
      <div>
        <label>
          <img src="https://img.icons8.com/fluency/48/protein-shake.png" alt="Optifast"/>
          Optifast ₹
        </label>
        <input id="price-opti" type="number" value="118752"/>
      </div>
      <div>
        <label>
          <img src="https://img.icons8.com/fluency/48/vegetarian-food.png" alt="Fiber Choice"/>
          Fiber Choice ₹
        </label>
        <input id="price-fib" type="number" value="0"/>
      </div>
    </div>

    <div class="search-box">
      <input id="filter-stockist" type="search" placeholder="🔍 Search Stockists…"/>
    </div>

    <div class="overflow-x-auto">
      <table id="sales-table">
        <thead>
          <tr>
            <th>Stockist</th><th>Res-Di Units</th><th>Res-Di Total</th>
            <th>Opti Units</th><th>Opti Total</th>
            <th>Fiber Units</th><th>Fiber Total</th>
            <th>Grand Total</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="body-sales"></tbody>
        <tfoot>
          <tr class="totals-row">
            <td>Totals</td>
            <td id="sum-resd-u">0</td><td id="sum-resd-v">0.00</td>
            <td id="sum-opti-u">0</td><td id="sum-opti-v">0.00</td>
            <td id="sum-fib-u">0</td><td id="sum-fib-v">0.00</td>
            <td id="sum-grand">0.00</td><td></td>
          </tr>
        </tfoot>
      </table>
    </div>

    <div class="actions">
      <button id="btn-add" class="btn btn-add">➕ Add Stockiest</button>
      <button id="btn-download" class="btn btn-download">📥 Download Excel</button>
    </div>

  </main>

  <footer>© 2025 Sales Tracker • Mohan</footer>

  <script>
    const $ = id => document.getElementById(id);
    const priceResD = $('price-resd'),
          priceOpti = $('price-opti'),
          priceFib   = $('price-fib'),
          body       = $('body-sales'),
          filter     = $('filter-stockist'),
          btnAdd     = $('btn-add'),
          btnDownload= $('btn-download'),
          sums       = {
            rdU: $('sum-resd-u'), rdV: $('sum-resd-v'),
            oU: $('sum-opti-u'), oV: $('sum-opti-v'),
            fU: $('sum-fib-u'), fV: $('sum-fib-v'),
            grand: $('sum-grand')
          };
    const STORAGE = 'sales-tracker-2025';
    let state = JSON.parse(localStorage.getItem(STORAGE) || '{"rows":[]}');
    state.rows.forEach(addRow); calc();

    btnAdd.onclick = () => { addRow(); save(); calc(); };
    [priceResD, priceOpti, priceFib].forEach(i => i.oninput = () => { save(); calc(); });
    filter.oninput = e => {
      const q = e.target.value.toLowerCase();
      [...body.rows].forEach(tr => {
        tr.style.display = tr.cells[0].firstChild.value.toLowerCase().includes(q) ? '' : 'none';
      });
    };
    btnDownload.onclick = () => {
      const wb = XLSX.utils.table_to_book($('sales-table'), { sheet: 'Sales' });
      XLSX.writeFile(wb, 'SalesTracker.xlsx');
    };

    function addRow(d={name:'',rd:0,o:0,f:0}) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input class="w-full" placeholder="Name" value="${d.name}"></td>
        <td><input type="number" min="0" class="qty-rd" value="${d.rd}"></td>
        <td class="cell-rd-v">0.00</td>
        <td><input type="number" min="0" class="qty-o" value="${d.o}"></td>
        <td class="cell-o-v">0.00</td>
        <td><input type="number" min="0" class="qty-f" value="${d.f}"></td>
        <td class="cell-f-v">0.00</td>
        <td class="cell-grand">0.00</td>
        <td><button class="btn btn-del">🗑</button></td>`;
      body.appendChild(tr);
      tr.querySelectorAll('input').forEach(i => i.oninput = () => { save(); calc(); });
      tr.querySelector('.btn-del').onclick = () => { tr.remove(); save(); calc(); };
    }

    function calc() {
      let rdU=0,oU=0,fU=0,rdV=0,oV=0,fV=0,g=0,
          pRD=+priceResD.value,pO=+priceOpti.value,pF=+priceFib.value;
      [...body.rows].forEach(tr => {
        const qRD=+tr.querySelector('.qty-rd').value||0,
              qO =+tr.querySelector('.qty-o').value||0,
              qF =+tr.querySelector('.qty-f').value||0,
              vRD=qRD*pRD, vO=qO*pO, vF=qF*pF, total=vRD+vO+vF;
        tr.querySelector('.cell-rd-v').textContent = vRD.toFixed(2);
        tr.querySelector('.cell-o-v').textContent = vO.toFixed(2);
        tr.querySelector('.cell-f-v').textContent = vF.toFixed(2);
        tr.querySelector('.cell-grand').textContent = total.toFixed(2);
        rdU+=qRD; oU+=qO; fU+=qF; rdV+=vRD; oV+=vO; fV+=vF; g+=total;
      });
      sums.rdU.textContent = rdU; sums.rdV.textContent = rdV.toFixed(2);
      sums.oU.textContent = oU; sums.oV.textContent = oV.toFixed(2);
      sums.fU.textContent = fU; sums.fV.textContent = fV.toFixed(2);
      sums.grand.textContent = g.toFixed(2);
    }

    function save() {
      const rows = [...body.rows].map(tr => ({
        name: tr.cells[0].firstChild.value,
        rd:   tr.querySelector('.qty-rd').value,
        o:    tr.querySelector('.qty-o').value,
        f:    tr.querySelector('.qty-f').value
      }));
      localStorage.setItem(STORAGE, JSON.stringify({rows}));
    }
  </script>
</body>
</html>
