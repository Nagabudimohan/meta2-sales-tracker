<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>2025 Sales Tracker • Perplexity AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --primary: #0a1931;
      --accent: #185adb;
      --surface: #f7fafd;
      --shadow: 0 4px 16px 0 rgba(24,90,219,0.05);
    }
    body {
      background: var(--surface);
      font-family: 'Inter', 'Segoe UI', 'Arial', sans-serif;
      color: #17202a;
      transition: background 0.3s;
    }
    header {
      background: #fff;
      box-shadow: var(--shadow);
      padding: 2.5rem 0 1.2rem 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-radius: 0 0 1.5rem 1.5rem;
      margin-bottom: 1.5rem;
    }
    .logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 60px; height: 60px;
      background: var(--surface);
      border-radius: 15px;
      box-shadow: 0 2px 12px 0 #e3e7ee;
      margin-bottom: 1rem;
    }
    .logo-img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      filter: drop-shadow(0 1px 2px var(--accent));
      opacity: 0.98;
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--accent);
      margin: 0;
    }
    .subtext {
      font-size: 1.08rem;
      color: #677483;
      letter-spacing: 0.04em;
      margin-top: 0.15em;
    }
    .main-card {
      background: #fff;
      border-radius: 1.35rem;
      box-shadow: var(--shadow);
      padding: 2.5rem 2rem 2rem 2rem;
      max-width: 1050px;
      margin-bottom: 2rem;
    }
    input {
      border: 1px solid #e5eaf3;
      background: #f1f4fa;
      border-radius: 0.65rem;
      padding: 0.9em 0.7em;
      font-size: 1.06rem;
      outline: none;
      width: 100%;
      box-shadow: 0 2px 8px 0 #e3eafc;
      margin-bottom: 0.02rem;
      color: var(--primary);
      transition: box-shadow 0.2s, background 0.2s, border-color 0.2s;
    }
    input:focus {
      background: #eaf1fe;
      border-color: var(--accent);
      box-shadow: 0 3px 20px 0 #b7d0fd;
    }
    label {
      display: block;
      font-size: 1.01rem;
      color: #5a6790;
      margin-bottom: 0.195rem;
      font-weight: 500;
    }
    #filter-stockist { max-width: 260px; margin-bottom: 1.22rem; }
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 0.7rem;
      margin-top: 0.5rem;
    }
    thead tr {
      background: #f3f6fb;
      position: sticky; top: 0;
      z-index: 1;
    }
    th, td {
      border: none;
      text-align: center;
      padding: 1em 0.58em;
      vertical-align: middle;
    }
    th {
      font-size: 0.96rem;
      color: var(--accent);
      background: #f1f4fa;
      text-transform: uppercase;
      font-weight: 700;
      border-radius: 0.52em 0.52em 0 0;
      letter-spacing: 0.07em;
    }
    td {
      background: #f7fafd;
      border-radius: 0.7em;
      font-size: 1.02rem;
      color: #22313a;
      box-shadow: 0 3px 10px 0 #e9eafd77;
      font-weight: 500;
      transition: background 0.18s;
    }
    tbody tr:hover td {
      background: #ddefff;
      color: var(--accent);
      transition: background 0.16s, color 0.15s;
    }
    .btn-add {
      background: var(--accent);
      color: #fff;
      padding: 0.76em 1.34em;
      border-radius: 0.7em;
      font-size: 1.07rem;
      font-weight: 600;
      outline: none;
      border: none;
      display: flex; align-items: center; gap: 0.45em;
      box-shadow: 0 3px 16px 0 #e3eafc;
      transition: background 0.16s, box-shadow 0.16s;
      cursor: pointer;
    }
    .btn-add:hover { background: #102154; box-shadow: 0 4px 18px 0 #b7d0fd; }
    .btn-del {
      color: #e74c3c;
      background: transparent;
      border: none;
      font-size: 1.2em;
      border-radius: 0.47em;
      cursor: pointer;
      padding: 0.36em 0.76em;
      transition: color 0.2s, background 0.2s;
    }
    .btn-del:hover { color: #c0392b; background: #fdecea; }
    .totals-row td {
      background: #eaf0ff !important ;
      color: #185adb;
      font-weight: 700;
      font-size: 1.03em;
    }
    .highlight {
      animation: highlight-bg 1s;
    }
    @keyframes highlight-bg {
      from { background-color: #b7d0fd; }
      to { background-color: transparent; }
    }
    @media (max-width:900px) {
      html { font-size: 95%; }
      .main-card { padding: 1.2em; }
      th, td { padding: 0.46em 0.18em;  }
    }
    @media (max-width:610px) {
      header { padding: 1.1em 0 0.48em 0; }
      .logo-wrap { width: 42px; height: 42px; }
      .main-card { padding: 0.55em; }
      .btn-add { padding: 0.6em 0.9em;}
      #filter-stockist { margin-bottom: 0.7rem; }
      th, td { font-size: 0.95em; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center">
  <header>
    <div class="logo-wrap">
      <!-- Neutral MNC-style logo, you can use your own or SVG corporate mark -->
      <img src="https://img.icons8.com/ios-filled/50/185adb/artificial-intelligence.png" alt="Logo" class="logo-img">
    </div>
    <h1>Sales Tracker</h1>
    <div class="subtext">2025 &bull; Made by Perplexity AI</div>
  </header>
  <main class="flex-grow flex flex-col w-full items-center">
    <section class="main-card w-full max-w-2xl mx-auto">
      <!-- Price Inputs -->
      <div class="grid grid-cols-1 sm:grid-cols-4 gap-6 mb-7">
        <div>
          <label>Resource Diabetic ₹</label>
          <input id="price-resd" type="number" value="0">
        </div>
        <div>
          <label>Optifast ₹</label>
          <input id="price-opti" type="number" value="118752">
        </div>
        <div>
          <label>Resource ₹</label>
          <input id="price-res" type="number" value="5064.66">
        </div>
        <div>
          <label>Fiberchoice ₹</label>
          <input id="price-fib" type="number" value="0">
        </div>
      </div>
      <!-- Stockist Search Box -->
      <input id="filter-stockist" type="search" placeholder="Search Stockists...">
      <!-- Data Table -->
      <div class="w-full overflow-x-auto">
        <table>
          <thead>
            <tr>
              <th>Stockist</th>
              <th>Res-Di Units</th>
              <th>Res-Di Total</th>
              <th>Opti Units</th>
              <th>Opti Total</th>
              <th>Res Units</th>
              <th>Res Total</th>
              <th>Fib Units</th>
              <th>Fib Total</th>
              <th>Grand Total</th>
              <th class="text-center">Actions</th>
            </tr>
          </thead>
          <tbody id="body-sales"></tbody>
          <tfoot>
            <tr class="totals-row">
              <td>Totals</td>
              <td id="sum-resd-u">0</td>
              <td id="sum-resd-v">0.00</td>
              <td id="sum-opti-u">0</td>
              <td id="sum-opti-v">0.00</td>
              <td id="sum-res-u">0</td>
              <td id="sum-res-v">0.00</td>
              <td id="sum-fib-u">0</td>
              <td id="sum-fib-v">0.00</td>
              <td id="sum-grand">0.00</td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>
      <!-- Add & Clear Buttons -->
      <div class="flex gap-4 mt-7 justify-center">
        <button id="btn-add" class="btn-add">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
               viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 5v14m7-7H5"/>
          </svg>
          <span>Add Stockist</span>
        </button>
        <button id="btn-clear" class="btn-del">Clear All</button>
      </div>
    </section>
  </main>
  <footer class="text-center text-xs text-gray-500 py-4">
    &copy; 2025 Sales Tracker &bull; Made by Perplexity AI
  </footer>
  <script>
    function el(id){return document.getElementById(id);}
    function animateSum(cell, value) {
      cell.textContent = value;
      cell.classList.remove('highlight');
      void cell.offsetWidth;
      cell.classList.add('highlight');
    }
    const priceResD = el('price-resd'), priceOpti = el('price-opti'),
          priceRes = el('price-res'), priceFib = el('price-fib'),
          body = el('body-sales'), btnAdd = el('btn-add'),
          sums = { rdU: el('sum-resd-u'), rdV: el('sum-resd-v'),
                   oU: el('sum-opti-u'), oV: el('sum-opti-v'),
                   rU: el('sum-res-u'), rV: el('sum-res-v'),
                   fU: el('sum-fib-u'), fV: el('sum-fib-v'),
                   grand: el('sum-grand') };
    const STORAGE='tracker-units-first-mnc';
    let state=JSON.parse(localStorage.getItem(STORAGE)||'{"rows":[]}');
    state.rows.forEach(addRow); calc();
    btnAdd.onclick=_=>{addRow();persist();calc()};
    [priceResD,priceOpti,priceRes,priceFib].forEach(i=>i.oninput=_=>{persist();calc()});
    function addRow(d={name:'',rd:0,o:0,r:0,f:0}) {
      const tr=document.createElement('tr'); tr.innerHTML=`
      <td><input class="w-full" value="${d.name}" placeholder="Name"></td>
      <td><input type=number min=0 class="qty-rd" value="${d.rd}"></td>
      <td class="cell-rd-v">0.00</td>
      <td><input type=number min=0 class="qty-o" value="${d.o}"></td>
      <td class="cell-o-v">0.00</td>
      <td><input type=number min=0 class="qty-r" value="${d.r}"></td>
      <td class="cell-r-v">0.00</td>
      <td><input type=number min=0 class="qty-f" value="${d.f}"></td>
      <td class="cell-f-v">0.00</td>
      <td class="cell-grand">0.00</td>
      <td><button class="btn-del">🗑</button></td>`;
      tr.querySelectorAll('input').forEach(i=>i.oninput=_=>{persist();calc()});
      tr.querySelector('.btn-del').onclick=_=>{
        if(confirm('Are you sure you want to delete this stockist?')) {
          tr.remove();persist();calc();
        }
      };
      body.appendChild(tr);
    }
    function calc() {
      let rdU=0,oU=0,rU=0,fU=0,rdV=0,oV=0,rV=0,fV=0, g=0,
          pRD=+priceResD.value,pO=+priceOpti.value,pR=+priceRes.value,pF=+priceFib.value;
      [...body.rows].forEach(tr=>{
        const qRD=+tr.querySelector('.qty-rd').value||0,
              qO=+tr.querySelector('.qty-o').value||0,
              qR=+tr.querySelector('.qty-r').value||0,
              qF=+tr.querySelector('.qty-f').value||0,
              vRD=qRD*pRD, vO=qO*pO, vR=qR*pR, vF=qF*pF,
              rowTotal=vRD+vO+vR+vF;
        tr.querySelector('.cell-rd-v').textContent=vRD.toFixed(2);
        tr.querySelector('.cell-o-v').textContent=vO.toFixed(2);
        tr.querySelector('.cell-r-v').textContent=vR.toFixed(2);
        tr.querySelector('.cell-f-v').textContent=vF.toFixed(2);
        tr.querySelector('.cell-grand').textContent=rowTotal.toFixed(2);
        rdU+=qRD; oU+=qO; rU+=qR; fU+=qF;
        rdV+=vRD; oV+=vO; rV+=vR; fV+=vF;
        g+=rowTotal;
      });
      animateSum(sums.rdU, rdU);
      animateSum(sums.rdV, rdV.toFixed(2));
      animateSum(sums.oU, oU);
      animateSum(sums.oV, oV.toFixed(2));
      animateSum(sums.rU, rU);
      animateSum(sums.rV, rV.toFixed(2));
      animateSum(sums.fU, fU);
      animateSum(sums.fV, fV.toFixed(2));
      animateSum(sums.grand, g.toFixed(2));
    }
    function persist(){
      const rows=[...body.rows].map(tr=>({
        name:tr.cells[0].firstChild.value,
        rd:tr.querySelector('.qty-rd').value,
        o:tr.querySelector('.qty-o').value,
        r:tr.querySelector('.qty-r').value,
        f:tr.querySelector('.qty-f').value
      }));
      localStorage.setItem(STORAGE,JSON.stringify({rows}));
    }
    // Stockist search functionality
    el('filter-stockist').oninput = e => {
      const filter = e.target.value.toLowerCase();
      [...body.rows].forEach(tr => {
        const name = tr.cells[0].firstChild.value.toLowerCase();
        tr.style.display = name.includes(filter) ? '' : 'none';
      });
    };
    el('btn-clear').onclick = () => {
      if (confirm('Clear all stockist data?')) {
        body.innerHTML = '';
        persist();
        calc();
      }
    };
  </script>
</body>
</html>
