<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>2025 Sales Tracker • Mohan</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom styles -->
  <style>
    /* ===== CSS Variables for quick theme tweaks ===== */
    :root {
      --clr-primary: #0a1931;
      --clr-accent: #185adb;
      --clr-surface: #f8fbff;
      --shadow-1: 0 4px 12px rgba(10,25,49,0.05);
      --shadow-2: 0 12px 32px rgba(10,25,49,0.08); /* layered shadow trick[15] */
    }

    /* ===== Base & layout ===== */
    body {
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: var(--clr-surface);
      color: var(--clr-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      background: #fff;
      box-shadow: var(--shadow-1);
      border-radius: 0 0 1.5rem 1.5rem;
      padding: 2.4rem 1rem 1.4rem;
      text-align: center;
      margin-bottom: 1.8rem;
      animation: slideDown 0.8s cubic-bezier(.7,1.5,.3,1) both;
    }
    @keyframes slideDown {
      from {transform: translateY(-50px); opacity:0;}
      to   {transform: none;               opacity:1;}
    }
    .logo-wrap {
      width: 60px; height: 60px;
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(8px);
      border-radius: 1rem;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem;
      box-shadow: var(--shadow-2);
    }
    h1 {
      font-size: 2.1rem; font-weight: 700; letter-spacing: -0.02em;
      color: var(--clr-accent);
    }
    .subtext {font-size: 1.05rem; color: #5c6b7a;}

    /* ===== Card ===== */
    .card {
      background: #ffffffcc; /* translucent for soft glass effect */
      backdrop-filter: blur(10px) saturate(160%);
      border-radius: 1.25rem;
      box-shadow: var(--shadow-2);
      padding: 2.2rem 2rem;
      max-width: 1050px;
      width: 100%;
      animation: fadeUp 0.9s 0.2s cubic-bezier(.7,1.5,.3,1) both;
    }
    @keyframes fadeUp {
      from {transform: translateY(60px) scale(.97); opacity:0;}
      to   {transform: none;                opacity:1;}
    }

    /* ===== Inputs ===== */
    input[type="number"], input[type="search"] {
      appearance: textfield;
      -moz-appearance: textfield;
      border: 1px solid #dbe0ea;
      background: #f1f5ff;
      border-radius: 0.7rem;
      padding: 0.85rem 0.75rem;
      font-size: 1.05rem;
      width: 100%;
      transition: box-shadow 0.25s, background 0.25s, border-color 0.25s;
    }
    input:focus-visible { /* accessible focus ring[1][7] */
      outline: none;
      border-color: var(--clr-accent);
      box-shadow: 0 0 0 3px rgba(24,90,219,.25);
    }

    /* ===== Table ===== */
    table {width:100%; border-spacing:0 0.7rem;}
    thead tr {background:#eef3ff; position:sticky; top:0; z-index:1;}
    th {
      font-size:0.9rem; text-transform:uppercase; font-weight:700;
      color:var(--clr-accent); padding:1rem 0.6rem;
    }
    td {
      background:#ffffffee; backdrop-filter:blur(4px);
      font-size:1.05rem; font-weight:500; color:#1f2d3d;
      padding:1rem 0.6rem; border-radius:0.7rem;
      box-shadow:var(--shadow-1);
      transition:background 0.18s, transform 0.18s;
    }
    tbody tr:hover td {
      background:#e0ecff;
      transform:scale(1.012);
    }
    .totals-row td {
      background:#e6edff!important; color:var(--clr-accent); font-weight:700;
    }

    /* ===== Buttons ===== */
    .btn {
      display:inline-flex; align-items:center; gap:0.45em;
      font-weight:600; border:none; cursor:pointer;
      border-radius:0.75rem; transition:background 0.2s, box-shadow 0.2s;
    }
    .btn-add {
      background:var(--clr-accent); color:#fff; padding:0.8em 1.4em;
      box-shadow:var(--shadow-2);
    }
    .btn-add:hover {background:#0e2b6d;}
    .btn-del {color:#e74c3c; background:transparent; font-size:1.2em; padding:0.35em;}
    .btn-del:hover {color:#c0392b;}
    .btn-clear {background:#ffebee; color:#b71c1c; padding:0.7em 1.2em;}
    .btn-clear:hover {background:#ffd7de;}

    /* ===== Animating totals highlight ===== */
    .highlight {animation: flash 1s;}
    @keyframes flash {0%{background:#c3d8ff;}100%{background:transparent;}}

    /* ===== Responsive tweaks ===== */
    @media(max-width:600px){
      html{font-size:93%;}
      .card{padding:1rem;}
      th,td{padding:0.55rem 0.3rem;}
    }
  </style>
</head>

<body>
  <!-- ===== Header ===== -->
  <header>
    <div class="logo-wrap">
      <!-- Replace with your own PNG/SVG if desired -->
      <img src="https://img.icons8.com/fluency/48/sales-performance.png" alt="Logo" class="logo-img">
    </div>
    <h1>Sales Tracker</h1>
    <p class="subtext">2025 • Made by Mohan</p>
  </header>

  <!-- ===== Main Card ===== -->
  <main class="flex-grow flex flex-col items-center w-full">
    <section class="card">
      <!-- Product Prices -->
      <div class="grid grid-cols-1 sm:grid-cols-4 gap-6 mb-8">
        <div><label>Resource Diabetic ₹</label><input id="price-resd" type="number" value="0"></div>
        <div><label>Optifast ₹</label><input id="price-opti" type="number" value="118752"></div>
        <div><label>Resource ₹</label><input id="price-res" type="number" value="5064.66"></div>
        <div><label>Fiber Choice ₹</label><input id="price-fib" type="number" value="0"></div>
      </div>

      <!-- Search -->
      <input id="filter-stockist" type="search" placeholder="Search Stockists…" class="mb-6">

      <!-- Data Table -->
      <div class="overflow-x-auto">
        <table>
          <thead>
            <tr>
              <th>Stockist</th><th>Res-Di Units</th><th>Res-Di Total</th>
              <th>Opti Units</th><th>Opti Total</th>
              <th>Res Units</th><th>Res Total</th>
              <th>Fiber Units</th><th>Fiber Total</th>
              <th>Grand Total</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="body-sales"></tbody>
          <tfoot>
            <tr class="totals-row">
              <td>Totals</td>
              <td id="sum-resd-u">0</td><td id="sum-resd-v">0.00</td>
              <td id="sum-opti-u">0</td><td id="sum-opti-v">0.00</td>
              <td id="sum-res-u">0</td><td id="sum-res-v">0.00</td>
              <td id="sum-fib-u">0</td><td id="sum-fib-v">0.00</td>
              <td id="sum-grand">0.00</td><td></td>
            </tr>
          </tfoot>
        </table>
      </div>

      <!-- Action Buttons -->
      <div class="flex flex-wrap gap-4 justify-center mt-8">
        <button id="btn-add" class="btn btn-add">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
               viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 5v14m7-7H5"/>
          </svg><span>Add Stockist</span>
        </button>
        <button id="btn-clear" class="btn btn-clear">Clear All</button>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="text-center text-xs text-gray-500 py-4">
    © 2025 Sales Tracker • Made by Mohan
  </footer>

  <!-- ===== Logic ===== -->
  <script>
    // ---------- Helpers ----------
    const $ = id => document.getElementById(id);
    const animate = (cell, val) => {cell.textContent = val;
      cell.classList.remove('highlight'); void cell.offsetWidth; cell.classList.add('highlight');};

    // ---------- Elements ----------
    const priceResD=$('price-resd'), priceOpti=$('price-opti'),
          priceRes=$('price-res'), priceFib=$('price-fib'),
          body=$('body-sales'), filter=$('filter-stockist'),
          btnAdd=$('btn-add'), btnClear=$('btn-clear'),
          sums={rdU:$('sum-resd-u'),rdV:$('sum-resd-v'),
                oU:$('sum-opti-u'),oV:$('sum-opti-v'),
                rU:$('sum-res-u'),rV:$('sum-res-v'),
                fU:$('sum-fib-u'),fV:$('sum-fib-v'),
                grand:$('sum-grand')};

    // ---------- Local Storage ----------
    const STORAGE='sales-tracker-2025';
    let state=JSON.parse(localStorage.getItem(STORAGE)||'{"rows":[]}');
    state.rows.forEach(addRow); calc();

    // ---------- Event Listeners ----------
    btnAdd.onclick = () => {addRow(); save(); calc();};
    btnClear.onclick = () =>{
      if(confirm('Clear all stockist data?')) {body.innerHTML=''; save(); calc();}
    };
    [priceResD,priceOpti,priceRes,priceFib].forEach(inp=>inp.oninput=()=>{save(); calc();});
    filter.oninput = e => {
      const f=e.target.value.toLowerCase();
      [...body.rows].forEach(tr=>{
        const name=tr.cells[0].firstChild.value.toLowerCase();
        tr.style.display=name.includes(f)?'':'none';
      });
    };

    // ---------- Functions ----------
    function addRow(d={name:'',rd:0,o:0,r:0,f:0}){
      const tr=document.createElement('tr');
      tr.innerHTML=`
        <td><input class="w-full" value="${d.name}" placeholder="Name"/></td>
        <td><input type="number" min="0" class="qty-rd" value="${d.rd}"/></td>
        <td class="cell-rd-v">0.00</td>
        <td><input type="number" min="0" class="qty-o" value="${d.o}"/></td>
        <td class="cell-o-v">0.00</td>
        <td><input type="number" min="0" class="qty-r" value="${d.r}"/></td>
        <td class="cell-r-v">0.00</td>
        <td><input type="number" min="0" class="qty-f" value="${d.f}"/></td>
        <td class="cell-f-v">0.00</td>
        <td class="cell-grand">0.00</td>
        <td><button class="btn-del">🗑</button></td>`;
      body.appendChild(tr);

      // row events
      tr.querySelectorAll('input').forEach(inp=>inp.oninput=()=>{save(); calc();});
      tr.querySelector('.btn-del').onclick=()=>{
        if(confirm('Delete this stockist?')){tr.remove(); save(); calc();}
      };
    }

    function calc(){
      let rdU=0,oU=0,rU=0,fU=0,rdV=0,oV=0,rV=0,fV=0,g=0,
          pRD=+priceResD.value,pO=+priceOpti.value,pR=+priceRes.value,pF=+priceFib.value;
      [...body.rows].forEach(tr=>{
        const qRD=+tr.querySelector('.qty-rd').value||0,
              qO =+tr.querySelector('.qty-o').value||0,
              qR =+tr.querySelector('.qty-r').value||0,
              qF =+tr.querySelector('.qty-f').value||0,
              vRD=qRD*pRD, vO=qO*pO, vR=qR*pR, vF=qF*pF,
              rowTotal=vRD+vO+vR+vF;
        tr.querySelector('.cell-rd-v').textContent=vRD.toFixed(2);
        tr.querySelector('.cell-o-v' ).textContent=vO.toFixed(2);
        tr.querySelector('.cell-r-v' ).textContent=vR.toFixed(2);
        tr.querySelector('.cell-f-v' ).textContent=vF.toFixed(2);
        tr.querySelector('.cell-grand').textContent=rowTotal.toFixed(2);

        rdU+=qRD; oU+=qO; rU+=qR; fU+=qF;
        rdV+=vRD; oV+=vO; rV+=vR; fV+=vF; g+=rowTotal;
      });
      animate(sums.rdU, rdU);           animate(sums.rdV, rdV.toFixed(2));
      animate(sums.oU , oU);            animate(sums.oV , oV.toFixed(2));
      animate(sums.rU , rU);            animate(sums.rV , rV.toFixed(2));
      animate(sums.fU , fU);            animate(sums.fV , fV.toFixed(2));
      animate(sums.grand, g.toFixed(2));
    }

    function save(){
      const rows=[...body.rows].map(tr=>({
        name:tr.cells[0].firstChild.value,
        rd  :tr.querySelector('.qty-rd').value,
        o   :tr.querySelector('.qty-o' ).value,
        r   :tr.querySelector('.qty-r' ).value,
        f   :tr.querySelector('.qty-f' ).value
      }));
      localStorage.setItem(STORAGE, JSON.stringify({rows}));
    }
  </script>
</body>
</html>
